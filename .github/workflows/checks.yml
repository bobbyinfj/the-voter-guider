name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Type-check, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # Generating the client needs no database; a placeholder URL keeps prisma.config.ts happy
      - run: npx prisma generate
      - run: npx tsc --noEmit --skipLibCheck
      - run: npm run lint
      - run: npm test
