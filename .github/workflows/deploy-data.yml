name: Deploy data to production

# Applies pending migrations and re-seeds the production database whenever data or the
# schema changes on main, so nobody has to run `npm run seed` by hand. The seed is
# idempotent (bundles are the source of truth) and keeps quiz option ids stable, so
# saved answers survive it.
#
# Needs two repo secrets:
#   PROD_DATABASE_URL  the Neon *direct* (non "-pooler") URL; migrate deploy takes an advisory
#                      lock that the pooler doesn't support.
#   BACKUP_PASSPHRASE  encrypts the backup each run keeps (see "Back up the database").
#
# Vercel deploys main on its own, so a schema change can briefly go live before its
# migration has run. Merge migration-only PRs first when that matters.

on:
  push:
    branches: [main]
    # Only what the seed reads (prisma/seed.ts) or the schema. Static files the app imports directly
    # (data/glossary, data/measures, data/research) ship with the Vercel build and don't need a
    # run, which would wake Neon's compute for nothing.
    paths:
      - "prisma/**"
      - "data/elections/**"
      - "data/maps/**"
      - "data/issues/**"
      - "data/enrichment/**"
      - "data/stances/**"
      - "data/quizzes/**"
      - "data/comparisons/**"
      - "lib/comparisons.ts"
  workflow_dispatch:
    inputs:
      status_only:
        description: "Only back up and print `prisma migrate status`; don't migrate or seed"
        type: boolean
        default: true

concurrency:
  group: prod-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Back up, migrate, seed
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npm test

      # A backup before anything is written, kept as an encrypted run artifact for 30 days (GitHub
      # deletes it after that, so storage rolls). The dump holds user accounts and quiz answers, so
      # only the encrypted copy leaves the runner. To restore one:
      #   gh run download <run-id> -n prod-db-backup
      #   openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in prod.dump.enc -out prod.dump
      #   pg_restore --clean --no-owner -d "$URL" prod.dump
      # Neon's point-in-time restore also works, within its history window.
      - name: Back up the database
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$DATABASE_URL" || { echo "PROD_DATABASE_URL secret is not set"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "BACKUP_PASSPHRASE secret is not set"; exit 1; }
          docker run --rm -e URL="$DATABASE_URL" postgres:17 \
            sh -c 'pg_dump --no-owner --format=custom "$URL"' > "$RUNNER_TEMP/prod.dump"
          printf '%s' "$BACKUP_PASSPHRASE" | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass stdin \
            -in "$RUNNER_TEMP/prod.dump" -out "$RUNNER_TEMP/prod.dump.enc"
          rm "$RUNNER_TEMP/prod.dump"
          ls -l "$RUNNER_TEMP/prod.dump.enc"
      - uses: actions/upload-artifact@v7
        with:
          name: prod-db-backup
          path: ${{ runner.temp }}/prod.dump.enc
          retention-days: 30
          if-no-files-found: error

      - run: npx prisma migrate status
        # Exits non-zero when migrations are pending; that's what the next step is for
        continue-on-error: true
      - if: ${{ !inputs.status_only }}
        run: npx prisma migrate deploy
      - if: ${{ !inputs.status_only }}
        run: npm run seed
